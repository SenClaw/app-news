[package]
name = "news"
version = "0.1.0"
edition = "2021"

[dependencies]
# The Space App SDK lives in the SenClaw daemon repo. `branch = "main"` tracks
# it as it moves; swap it for `rev = "<sha>"` when a release has to be
# reproducible byte-for-byte months later. Cargo.lock records the exact commit
# either way, so a committed lockfile already makes CI builds repeatable.
app-space-sdk = { git = "https://github.com/SenClaw/senclaw.git", branch = "main" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["fs", "cors"] }
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = "0.3"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
quick-xml = "0.37"
chrono = { version = "0.4", features = ["clock"] }
sha2 = "0.10"
hex = "0.4"
url = "2"

[dev-dependencies]
tempfile = "3"

# Space App zips are capped at 20 MB by the hub. Stripping symbols and letting
# LTO drop unreachable code keeps the binary small.
[profile.release]
strip = true
lto = true
codegen-units = 1
